<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16" />
      <stop offset="0.5" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="tv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="240" r="300" fill="#4F46E5" fill-opacity="0.15" filter="blur(80px)" />
  <circle cx="750" cy="280" r="220" fill="#06B6D4" fill-opacity="0.1" filter="blur(70px)" />

  <!-- Grid accent lines -->
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#334155" stroke-opacity="0.3" />
  <line x1="120" y1="0" x2="120" y2="630" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <line x1="1080" y1="0" x2="1080" y2="630" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="8 8" />

  <!-- Central Nexus Logo Mark (Scale 2.2x) -->
  <g transform="translate(540, 100) scale(1.2)">
    <path d="M50 6 L86 26.5 L86 67.5 L50 88 L14 67.5 L14 26.5 Z" fill="#0F172A" stroke="url(#tv-grad)" stroke-width="4.5" />
    <path d="M28 32 L72 32 L68 40 L32 40 Z" fill="url(#tv-grad)" />
    <path d="M50 42 L66 42 L50 74 L34 42 L50 42 Z" fill="#38BDF8" />
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="600" y="320" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">
    ToolVerse <tspan fill="#38BDF8">AI</tspan>
  </text>

  <text x="600" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="28" fill="#94A3B8" letter-spacing="0">
    Smart Tools. Simple Solutions.
  </text>

  <text x="600" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="500" font-size="20" fill="#64748B">
    AI Generators • High-Speed PDF Suite • Client-Side Image Processing • Precision Calculators
  </text>

  <!-- Footer Badges -->
  <rect x="360" y="490" width="480" height="42" rx="21" fill="#1E293B" stroke="#334155" />
  <text x="600" y="517" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">
    🔒 100% In-Browser Privacy  •  ⚡ Sub-Second AI  •  🚀 Zero Install
  </text>
</svg>
